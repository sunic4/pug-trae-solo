doc_type: refactor-checklist
refactor: 2026-04-25-code-analysis
status: draft

steps:
  - id: step-1
    name: 优化 AppContext 类型定义
    description: 修改 AppContext 接口，统一 renderer 类型定义
    actions:
      - file: packages/core/src/app-context.ts
        changes: 将 renderer 属性类型从 Renderer | undefined 改为 Renderer | null
    checks:
      - name: TypeScript 类型检查
        command: tsc --noEmit
        expected: 无类型错误

  - id: step-2
    name: 提取公共主题获取逻辑
    description: 在 utils.ts 中添加 getThemeFromContext 函数，修改组件使用公共函数
    actions:
      - file: packages/components/src/utils.ts
        changes: 添加 getThemeFromContext 函数
      - file: packages/components/src/button.ts
        changes: 使用 getThemeFromContext 函数
    checks:
      - name: 测试套件
        command: npm test
        expected: 所有测试通过

  - id: step-3
    name: 统一组件 API 设计
    description: 修改组件构造函数，只从 props 中获取 appContext
    actions:
      - file: packages/components/src/button.ts
        changes: 修改构造函数，只从 props 中获取 appContext
      - file: packages/components/src/text.ts
        changes: 修改构造函数，只从 props 中获取 appContext
    checks:
      - name: 测试套件
        command: npm test
        expected: 所有测试通过

  - id: step-4
    name: 优化组件树中 AppContext 传递
    description: 修改 addChild 方法，优化 appContext 传递逻辑
    actions:
      - file: packages/composer/src/node.ts
        changes: 优化 addChild 方法中的 appContext 传递逻辑
    checks:
      - name: 测试套件
        command: npm test
        expected: 所有测试通过

  - id: step-5
    name: 优化渲染性能，只绘制脏节点
    description: 修改 drawAllNodes 方法，只绘制脏节点
    actions:
      - file: packages/renderer/src/canvas-renderer.ts
        changes: 修改 drawAllNodes 方法，只绘制脏节点
    checks:
      - name: 测试套件
        command: npm test
        expected: 所有测试通过

  - id: step-6
    name: 移除全局主题上下文依赖
    description: 移除全局主题上下文和全局 AppContext 引用
    actions:
      - file: packages/theme/src/theme-context.ts
        changes: 移除全局主题上下文和全局 AppContext 引用
    checks:
      - name: 测试套件
        command: npm test
        expected: 所有测试通过
