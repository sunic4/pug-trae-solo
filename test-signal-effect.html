<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Signal and Effect</title>
</head>
<body>
  <h1>Testing Signal and Effect</h1>
  <button id="testBtn">Click to Change State</button>
  <div id="output"></div>
  
  <script type="module">
    // 从源代码中导入我们的 signal 和 effect
    import { signal, trackDependencies } from '/workspace/packages/reactivity/src/signal.js';
    import { effect } from '/workspace/packages/reactivity/src/effect.js';
    
    console.log('[TEST] Starting test...');
    
    // 创建一个简单的 signal
    const testSignal = signal({ currentPage: 'home' });
    console.log('[TEST] Initial signal value:', testSignal.value);
    
    // 创建一个 effect
    effect(() => {
      console.log('[TEST] Effect running');
      const { currentPage } = testSignal.value;
      console.log('[TEST] Current page:', currentPage);
      document.getElementById('output').textContent = `Current page: ${currentPage}`;
    });
    
    // 添加点击事件
    document.getElementById('testBtn').addEventListener('click', () => {
      console.log('[TEST] Button clicked');
      const current = testSignal.value.currentPage;
      const next = current === 'home' ? 'details' : 'home';
      console.log('[TEST] Changing to:', next);
      testSignal.value = { currentPage: next };
      console.log('[TEST] Signal value after change:', testSignal.value);
    });
    
    console.log('[TEST] Test setup complete');
  </script>
</body>
</html>
